{% extends "base.html" %}
{% block title %}登录 · 员工门户{% endblock %}
{% block body %}
<div class="card" style="max-width:520px">
  <h1>登录</h1>
  {% if error %}<div class="msg err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="login">用户名或邮箱</label>
    <input id="login" name="login" type="text" required autofocus
           placeholder="alice 或 alice@example.test">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" required placeholder="演示账号 alice / Wonderland-1">
    <button type="submit">登录</button>
  </form>
  <p class="small muted" style="margin-top:16px">
    忘记密码？<a href="/reset/request">通过邮箱找回</a>
  </p>
</div>
{% endblock %}
